<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Warriors Notifications</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<style>
  body{font-family:Arial,sans-serif;text-align:center;padding:50px 20px;background:#f5f5f5}
  .box{max-width:420px;margin:auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 2px 10px #0002}
  button{padding:15px 30px;font-size:18px;background:#e53935;color:#fff;border:none;border-radius:8px;cursor:pointer}
  #status{margin-top:20px;color:green;font-size:16px}
</style>
</head>
<body>
<div class="box">
  <h2>🔔 Turn On Exam Warriors Notifications</h2>
  <p>Allow notifications to get instant updates about new Mock Tests.</p>
  <button id="btn">Allow Notifications</button>
  <div id="status"></div>
  <p><a href="https://www.examwarriors.online/">← Back to website</a></p>
</div>

<script>
(function () {
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inApp = /FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\/|Snapchat|; wv\)|WebView/i.test(ua);
  var supported = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);

  if (isAndroid && (inApp || !supported)) {
    window.location.replace('intent://' + location.host + location.pathname + location.search +
      '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
      encodeURIComponent(location.href) + ';end');
    return;
  }
  if (!supported || (isIOS && inApp)) {
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.querySelector('.box');
      if (box) {
        box.innerHTML = '<h3>⚠️ Notifications are not supported in this browser</h3>' +
          '<p>Tap the <b>⋯</b> menu at the top right and choose <b>Open in Browser / Safari</b>.</p>' +
          '<p>On iPhone: open in Safari, tap Share → <b>Add to Home Screen</b>, then open the site from your home screen and tap Allow.</p>';
      }
    });
  }
})();
</script>

<script>
var firebaseConfig = {
  apiKey: 'AIzaSyA3ny0kw_Ejyjbbw6Rm63RCoZmT5h0dpaU',
  authDomain: 'examwarriors-89447.firebaseapp.com',
  projectId: 'examwarriors-89447',
  storageBucket: 'examwarriors-89447.firebasestorage.app',
  messagingSenderId: '759292058436',
  appId: '1:759292058436:web:4b09da2acedbe3779d5511'
};
var VAPID_KEY = 'BNySdfk5WiCEMThnglTFA_4u6XFymiGIvvOIVvWRMEhJNxika8Hnl8mlQSSeBbflW_lPjAzbDf3tNm5AB1BmDqE'.trim();
var SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbzP42ecIh6I_PcoRIklv0hZFBI64l-l8YxHGCXLXa_aqzwqMhD8vopTSewDbRjD5V-Wag/exec';

var statusEl = document.getElementById('status');
if ('serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window) {
  firebase.initializeApp(firebaseConfig);
  var messaging = firebase.messaging();

  navigator.serviceWorker.register('firebase-messaging-sw.js').then(function (reg) {
    document.getElementById('btn').onclick = function () {
      Notification.requestPermission().then(function (p) {
        if (p !== 'granted') {
          statusEl.style.color = 'red';
          statusEl.innerText = 'Notifications are blocked. Please allow them in your browser settings.';
          return;
        }
        statusEl.style.color = 'green';
        statusEl.innerText = 'Permission granted...';
        messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg }).then(function (token) {
          if (!token) { statusEl.innerText = 'Could not get a token. Please try again.'; return; }
          fetch(SHEET_API_URL + '?token=' + encodeURIComponent(token), { method: 'GET', mode: 'no-cors' });
          statusEl.innerText = '✅ Subscribed! Thank you.';
        }).catch(function (e) {
          statusEl.style.color = 'red';
          statusEl.innerText = 'Error: ' + e.message;
          console.log(e);
        });
      });
    };
  }).catch(function (e) {
    statusEl.style.color = 'red';
    statusEl.innerText = 'Service worker error: ' + e.message;
  });
}
</script>
</body>
</html>
