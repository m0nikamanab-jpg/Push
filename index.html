<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join For Updates</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f1f3f6;font-family:'Segoe UI',Tahoma,sans-serif;padding:16px}
  .card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:24px;
        box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
  h2{margin:0 0 6px;font-size:20px}
  p.sub{margin:0 0 18px;color:#666;font-size:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
       padding:13px;margin-top:12px;border:0;border-radius:10px;color:#fff;
       font-size:15px;font-weight:bold;text-decoration:none;cursor:pointer}
  .push{background:#e53935}
  .wa{background:#25D366}
  .tg{background:#0088cc}
  .fb{background:#1877F2}
  .back{background:#333}
  #status{font-size:13px;margin:10px 0 0;min-height:18px}
  hr{border:0;border-top:1px solid #eee;margin:20px 0 6px}
  .label{font-size:13px;color:#888}
</style>
</head>
<body>
<div class="card">
  <h2>🔔 Join For Updates</h2>
  <p class="sub">Get our posts fast! Tap Allow, then turn on notifications from the links below.</p>

  <button id="allowBtn" class="btn push"><i class="fas fa-bell"></i> Allow Notifications</button>
  <p id="status"></p>

  <div id="inappBox" style="display:none;margin-top:12px;padding:12px;background:#fff3cd;border-radius:10px;font-size:13px;color:#664d03">
    <span id="inappMsg">Opening in Chrome...</span>
    <a id="chromeBtn" class="btn push" href="#"><i class="fas fa-globe"></i> Open in Chrome</a>
  </div>

  <hr>
  <div class="label">Join us on other platforms</div>

  <a class="btn wa" target="_blank" rel="noopener"
     href="https://chat.whatsapp.com/GLFRW19rq5JIyxIPOje45M">
     <i class="fab fa-whatsapp"></i> Join WhatsApp</a>

  <a class="btn tg" target="_blank" rel="noopener"
     href="https://t.me/+8d7TIFqC8Vc0NTk9">
     <i class="fab fa-telegram-plane"></i> Join Telegram</a>

  <a class="btn fb" target="_blank" rel="noopener"
     href="https://www.facebook.com/groups/1349780560477734">
     <i class="fab fa-facebook-f"></i> Join Facebook</a>

  <a id="backBtn" class="btn back" href="#">
     <i class="fas fa-arrow-left"></i> Back to Website</a>
</div>

<script>
  var BLOG_URL = 'https://www.examwarriors.online/';

  var allowBtn = document.getElementById('allowBtn');
  var statusEl = document.getElementById('status');

  document.getElementById('backBtn').href = BLOG_URL;

  // ===== Auto redirect to Chrome for unsupported / in-app browsers =====
  (function () {
    var ua = navigator.userAgent || '';
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var inApp = /FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\/|Snapchat|; wv\)|WebView/i.test(ua);
    var supported = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);

    if (supported && !inApp) return;

    var box = document.getElementById('inappBox');
    var chromeBtn = document.getElementById('chromeBtn');
    var msg = document.getElementById('inappMsg');
    box.style.display = 'block';

    var chromeUrl = '';
    if (isAndroid) {
      chromeUrl = 'intent://' + location.host + location.pathname + location.search +
        '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
        encodeURIComponent(location.href) + ';end';
    } else if (isIOS) {
      chromeUrl = 'googlechromes://' + location.host + location.pathname + location.search;
    }

    if (!chromeUrl) {
      msg.textContent = 'This browser does not support notifications. Please open this page in Chrome.';
      chromeBtn.style.display = 'none';
      return;
    }

    chromeBtn.href = chromeUrl;

    // Redirect only once, to avoid a loop
    var tried = false;
    try { tried = sessionStorage.getItem('chromeRedirectTried') === '1'; } catch (e) {}

    if (!tried) {
      try { sessionStorage.setItem('chromeRedirectTried', '1'); } catch (e) {}
      msg.textContent = 'Opening in Chrome...';
      setTimeout(function () { window.location.href = chromeUrl; }, 300);
      // If redirect did not work, show manual message
      setTimeout(function () {
        msg.textContent = 'Could not open Chrome automatically. Tap the button below, or use the ⋯ menu and choose "Open in Browser".';
      }, 2500);
    } else {
      msg.textContent = 'Please open this page in Chrome to turn on notifications.';
    }
  })();

  // ===== Notification permission =====
  function showGranted(){
    allowBtn.innerHTML = '<i class="fas fa-check"></i> Notifications Enabled';
    allowBtn.style.background = '#2e7d32';
    statusEl.style.color = '#2e7d32';
    statusEl.textContent = '✅ Done! Now join the other channels below.';
  }

  if (!('Notification' in window)) {
    statusEl.style.color = '#c62828';
    statusEl.textContent = 'Notifications are not supported in this browser.';
  } else if (Notification.permission === 'granted') {
    showGranted();
  } else if (Notification.permission === 'denied') {
    statusEl.style.color = '#c62828';
    statusEl.textContent = 'Notifications are blocked. Please allow them in your browser\'s site settings.';
  }

  allowBtn.addEventListener('click', async function(){
    if (!('Notification' in window)) return;
    var result = await Notification.requestPermission();
    if (result === 'granted') {
      showGranted();
      // Your push service subscribe code goes here
    } else {
      statusEl.style.color = '#c62828';
      statusEl.textContent = 'Permission was not granted. Please try again.';
    }
  });
</script>
</body>
</html>
