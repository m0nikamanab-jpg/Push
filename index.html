<script>
  var BLOG_URL = 'https://www.examwarriors.online/';

  var allowBtn = document.getElementById('allowBtn');
  var statusEl = document.getElementById('status');

  document.getElementById('backBtn').href = BLOG_URL;

  function showGranted(){
    allowBtn.innerHTML = '<i class="fas fa-check"></i> Notifications Enabled';
    allowBtn.style.background = '#2e7d32';
    statusEl.style.color = '#2e7d32';
    statusEl.textContent = '✅ Done! Now join the other channels below.';
  }

  if (!('Notification' in window)) {
    statusEl.style.color = '#c62828';
    statusEl.textContent = 'Notifications are not supported in this browser. Please open this page in Chrome.';
  } else if (Notification.permission === 'granted') {
    showGranted();
  } else if (Notification.permission === 'denied') {
    statusEl.style.color = '#c62828';
    statusEl.textContent = 'Notifications are blocked. Please allow them in your browser\'s site settings.';
  }

  allowBtn.addEventListener('click', async function(){
    if (!('Notification' in window)) return;
    var result = await Notification.requestPermission();
    if (result === 'granted') {
      showGranted();
      // Your push service subscribe code goes here
    } else {
      statusEl.style.color = '#c62828';
      statusEl.textContent = 'Permission was not granted. Please try again.';
    }
  });
</script>
